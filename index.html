<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gym God</title>
<!-- SDK CrazyGames: tải không được (mất mạng, chạy ngoài CrazyGames) thì game vẫn chạy bình thường, chỉ không có quảng cáo -->
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<style>
:root{--ink:#12284a;--bg:#0f2a52;--panel:#1d4f91;--card:#3b7bd180;--line:#5b9be6;--txt:#f3f9ff;--mute:#bcd6f5;--gold:#ffc83d;--gold2:#ff9a1f;--aura:#7c8aa5}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"Baloo 2","Nunito","Segoe UI",system-ui,sans-serif;font-weight:600;background:var(--bg);color:var(--txt);display:grid;place-items:center;user-select:none;-webkit-user-select:none;overflow:hidden}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.frame{position:relative;width:100%;height:100dvh;display:grid;grid-template-columns:1fr minmax(384px,456px);overflow:hidden;background:linear-gradient(#2b6cc4,#3f8ee0 62%,#17407a)}
@media(max-width:900px){.frame{grid-template-columns:1fr;grid-template-rows:54% 46%;}}

/* ---------- sân khấu ---------- */
.stage{position:relative;z-index:1;overflow:hidden;display:flex;flex-direction:column;min-height:0}
#bg{position:absolute;inset:0;background:center bottom/cover no-repeat}
.hud{position:relative;z-index:2;padding:12px 14px 0;display:flex;gap:10px;align-items:center}
.rank{flex:1;min-width:0;display:flex;gap:10px;align-items:center;background:#0006;border:2px solid var(--line);border-radius:16px;padding:6px 12px 6px 6px}
.badge{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:1.3rem;color:var(--ink);background:linear-gradient(#fff,var(--aura));box-shadow:0 0 14px var(--aura)}
.rank b{display:block;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank small{color:var(--mute);line-height:1.1;display:block}
.bar{height:8px;border-radius:9px;background:#0008;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--aura),#fff);transition:width .2s}
.round{flex:none;min-width:44px;height:44px;border-radius:14px;border:2px solid var(--line);background:#0006;font-weight:800;cursor:pointer}
#boost{padding:3px 10px;border-radius:999px;border:2px solid var(--gold);background:#000a;color:var(--gold);font:inherit;font-weight:800;font-size:.9rem;cursor:pointer}
#boost:disabled{border-color:var(--line);color:#fff;cursor:default}
.money{position:relative;z-index:2;text-align:center;margin-top:6px;line-height:1}
.money .n{font-size:clamp(2.2rem,7vw,3.4rem);font-weight:800;color:#fff;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink),0 0 24px #ffb02e88}
.money .r{display:inline-block;margin-top:6px;padding:3px 12px;border-radius:99px;background:#0007;color:var(--gold);font-size:.9rem}
.hero{position:relative;flex:1;min-height:0;display:grid;grid-template-rows:minmax(0,1fr);place-items:center;cursor:pointer;border:0;background:none;padding:0;width:100%}
.hero>*{grid-area:1/1}
.hero.hint::after{content:'👆';grid-area:1/1;z-index:3;translate:0 45%;font-size:3.4rem;pointer-events:none;filter:drop-shadow(0 3px 0 #0008);animation:poke .9s ease-in-out infinite}   /* người mới: tay chỉ vào nhân vật cho tới vài cú bấm đầu */
@keyframes poke{50%{transform:translateY(-16px) scale(.9)}}
.aura,.rays{height:min(100%,640px);aspect-ratio:1;border-radius:50%;pointer-events:none}
.aura{background:radial-gradient(circle,var(--aura) 0,transparent 66%);opacity:.6}
.rays{background:repeating-conic-gradient(var(--aura) 0 7deg,transparent 7deg 22deg);-webkit-mask:radial-gradient(circle,#000 18%,transparent 68%);mask:radial-gradient(circle,#000 18%,transparent 68%);opacity:.28;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
#art{height:100%;max-height:640px;min-height:0;display:grid;place-items:center;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 6px 0 #0003)}
#art>*{grid-area:1/1;height:100%;min-height:0;max-width:100%;object-fit:contain}
#art.pic::before{content:"";grid-area:1/1;align-self:end;justify-self:center;width:62%;height:5%;border-radius:50%;background:#000a;filter:blur(5px);transform:translateY(30%)}
@keyframes bob{50%{transform:translateY(-6px)}}
.pop{position:absolute;z-index:3;pointer-events:none;font-weight:800;font-size:1.9rem;color:#fff;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;rotate:var(--r);animation:pop .8s ease-out forwards}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.6)}20%{transform:translate(-50%,-80%) scale(1.15)}to{transform:translate(-50%,-190%) scale(1);opacity:0}}
.tip{position:relative;z-index:2;align-self:center;margin-bottom:10px;padding:2px 14px;border-radius:99px;background:#000a;font-size:.9rem}
.tip.warn{padding:8px 22px;background:#e5484d;color:#fff;font-size:1.15rem;font-weight:800;border:3px solid #fff;box-shadow:0 0 0 0 #ff4d5e;animation:warn 1s ease-in-out infinite}
@keyframes warn{50%{transform:scale(1.1);background:#ff7b88;box-shadow:0 0 22px 6px #ff4d5e}}
#office{position:relative;z-index:2;align-self:center;width:min(92%,460px);margin-top:12px}
.frame:not(.office) #office,.office .money,.office .tip{display:none}
#say,#hsay{margin:0 0 8px;padding:12px 16px;border-radius:16px;background:#fff;color:var(--ink);font-weight:800;font-size:1.1rem;line-height:1.25;text-align:center;box-shadow:0 4px 0 #0005}
#ostats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#ostats .stat{padding:6px 12px;background:#000b;font-size:.9rem;white-space:nowrap}
#nav{position:relative;z-index:2;align-self:center;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:10px}
#nav .big{padding:12px 22px;font-size:1.2rem}
#go:not(:disabled),#sleep{animation:pulseG 1.2s ease-in-out infinite}
@keyframes pulseG{50%{transform:scale(1.08);box-shadow:0 4px 0 #0f6b35,0 0 18px #6ee89a}}
#nav .big:active:not(:disabled),#modal .big:active:not(:disabled){box-shadow:0 1px 0 #0f6b35}
#rest{background:linear-gradient(#8fa3c8,#5b6f96);box-shadow:0 4px 0 #2f3d5c}
.frame:not(.office) #go,.frame:not(.office) #rest,.frame:not(.home) #sleep,.office .panel{display:none}
#vit{position:relative;z-index:2;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:8px;padding:0 10px;font-size:.85rem}
.office #vit,.gym #dayPill{display:none}
.hud,.money,#vit,#office,#homeBox,#nav,.tip{flex:none}
@media(max-width:900px){
  .frame.home{grid-template-rows:68% 32%}.home #bg{bottom:32%}
  .frame.gym{grid-template-rows:60% 40%}.gym #bg{bottom:40%}
  #vit{font-size:.75rem;gap:4px;margin-top:6px}.pill{padding:2px 8px}.pill .bar{width:48px}
  .meal{padding:6px 4px;font-size:.72rem}.meal span{font-size:1.5rem}.meal img{width:36px;height:36px}
  #nav .big{padding:9px 18px;font-size:1.05rem}
  .frame.home .money,.frame.home .tip{display:none}   /* ở nhà trên điện thoại: nhường chỗ cho nhân vật; giá gọi bạn tập vẫn hiện trên nút */
  #ostats .stat{padding:5px 8px;font-size:.78rem}
  .hud{gap:5px;padding:10px 8px 0}.round{min-width:38px;height:40px;border-radius:12px}.rank{gap:8px;padding-right:8px}.rank b{white-space:normal;font-size:.9rem}   /* 4 nút tròn: tên hạng dài xuống dòng thay vì bị cắt */
}
.pill{display:flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;background:#000a;border:2px solid var(--line);font-weight:800;white-space:nowrap}
.pill .bar{width:70px;margin:0}
.pill[hidden]{display:none}
#staBar{background:linear-gradient(90deg,#3ddc84,#b6ff8a)}
@media(min-width:901px){#vit{font-size:1.05rem;gap:10px;margin-top:10px}#vit .pill{padding:6px 16px}#vit .pill .bar{width:110px;height:10px}#boost{font-size:1.05rem;padding:6px 16px}}   /* máy tính: chỉ số to hơn cho dễ nhìn */
#goHome{cursor:pointer;color:var(--gold);border-color:var(--gold)}
#goHome.pulse{animation:pulse .8s ease-in-out infinite}
.frame:not(.gym) #goHome{display:none}
#homeBox{position:relative;z-index:2;align-self:center;width:min(94%,520px);margin-top:10px}
.frame:not(.home) #homeBox{display:none}
#meals{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
#meals[hidden]{display:none}
.meal{border:2px solid var(--line);border-radius:14px;background:#000b;padding:8px 6px;cursor:pointer;line-height:1.2;font-size:.8rem;display:grid;justify-items:center;align-content:start;gap:2px}
.meal span{font-size:2rem;line-height:1}
.meal img{width:48px;height:48px;object-fit:contain;display:block}
.meal b{font-size:.9rem}
.meal em{font-style:normal;color:#7dffb0}
.meal.on{border-color:var(--gold);background:#2f73c9}
.meal:disabled{opacity:.5;cursor:not-allowed}
.meal.on:disabled{opacity:1}
.home .tabs button:not(#tabPet),.gym .tabs #tabPet{display:none}
#oday{margin:0 0 6px;text-align:center;font-weight:800;font-size:1.2rem;text-shadow:0 2px 0 var(--ink)}
#wk{display:flex;gap:4px;justify-content:center;margin:0 0 4px}
#wk i{font-style:normal;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:#000b;border:2px solid var(--line);font-size:.8rem;font-weight:800}
#wk i.now{border-color:var(--gold);color:var(--gold)}
#wkTxt{text-align:center;font-size:.85rem;font-weight:800;color:var(--gold);margin-bottom:6px;text-shadow:0 1px 2px #000}
.frame.office{grid-template-columns:1fr}
.office .hero{cursor:default}
@media(max-width:900px){#evBox .big{font-size:.82rem;padding:6px 4px}#evBox small{font-size:.68rem}.frame.office{grid-template-rows:1fr}.office #bg{bottom:0}}
#flash{position:absolute;inset:0;z-index:5;background:#fff;opacity:0;pointer-events:none}
#toast{position:absolute;z-index:6;left:50%;top:38%;transform:translate(-50%,-50%);text-align:center;font-weight:800;font-size:1.5rem;line-height:1.15;padding:12px 22px;border-radius:18px;background:#000b;border:3px solid var(--aura);text-shadow:0 2px 0 var(--ink);opacity:0;pointer-events:none;max-width:90%}
#toast small{display:block;font-size:1rem;color:var(--gold)}

/* ---------- bảng ---------- */
.panel{position:relative;z-index:1;display:flex;flex-direction:column;min-height:0;margin:12px;border-radius:20px;overflow:hidden;background:#174a8ce8;border:3px solid #0009;box-shadow:0 10px 30px #0008}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;padding:8px 8px 0}
.tabs button::first-line{font-size:1.25rem}
.tabs .dot::after{content:"";position:absolute;top:6px;right:10px;width:10px;height:10px;border-radius:50%;background:#ff4d5e;box-shadow:0 0 0 2px #174a8c}
.tabs button{position:relative;font-size:.62rem;white-space:pre-line;line-height:1.2;border:0;border-radius:12px 12px 0 0;padding:5px 0 4px;font-weight:700;color:var(--mute);background:#0004;cursor:pointer}
.tabs .on{background:#2f73c9;color:#fff;box-shadow:inset 0 3px 0 var(--gold)}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.view[hidden]{display:none}
.tools{display:flex;align-items:center;gap:6px;padding:10px 12px;background:#2f73c9;font-weight:700}
.tools span{flex:1}
.chip{border:2px solid var(--line);background:#0004;color:var(--mute);border-radius:99px;padding:0 12px;font-weight:700;cursor:pointer}
.chip.on{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.list{flex:1;overflow:auto;padding:10px;display:grid;gap:8px;align-content:start;background:linear-gradient(#2f73c9,var(--panel) 80px)}
.card{display:grid;grid-template-columns:60px 1fr auto;gap:10px;align-items:center;padding:8px;border-radius:16px;background:var(--card);border:2px solid var(--line)}
.tile{width:60px;height:60px;border-radius:14px;display:grid;place-items:center;font-size:1.8rem;overflow:hidden;box-shadow:inset 0 -4px 0 #0003,inset 0 2px 0 #fff5}
.tile img{width:100%;height:100%;object-fit:contain;padding:3px}
.card b{font-size:1.05rem;line-height:1.1}
.lv{font-size:.75rem;font-weight:700;color:var(--ink);background:#fff;border-radius:99px;padding:0 7px;margin-left:4px;vertical-align:1px}
.card small{display:block;color:var(--mute);line-height:1.2}
.card em{font-style:normal;color:#7dffb0;font-weight:700;font-size:.85rem}
.buy,.big{border:0;border-radius:12px;min-width:88px;min-height:44px;padding:5px 10px;font-weight:800;line-height:1.1;color:var(--ink);background:linear-gradient(var(--gold),var(--gold2));box-shadow:0 4px 0 #b85c00;cursor:pointer}
.buy small{color:inherit;opacity:.7;font-size:.75rem}
.buy:active:not(:disabled),.big:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #b85c00}
.buy:disabled{background:linear-gradient(90deg,#5a8fd6 var(--p),#3d5f8f var(--p))!important}
.buy.pulse{animation:pulse .8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 4px 0 #b85c00,0 0 18px var(--gold)}}
.lv:empty{display:none}
.card em,.ms{display:inline-block;white-space:nowrap;margin-right:8px}
.ms{font-style:normal;color:var(--gold);font-size:.75rem}
.goal{display:block;font-style:normal;font-size:.8rem;font-weight:700;color:#ffb3b3}
.goal.ok{color:#7dffb0}
.card.hid{opacity:.8}
.card.next{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 0 18px #ffd35c66}   /* bài cần mua tiếp để lên hạng */
.frame:not(.office) .rank{cursor:pointer}
.card.hid .tile{background:#0005!important;box-shadow:none}
.card.hid .tile img{filter:brightness(0);opacity:.45}
.buy:disabled,.big:disabled{background:#3d5f8f;color:#b5c9e6;box-shadow:0 4px 0 #223c63;cursor:not-allowed}
.asc{flex:1;overflow:auto;padding:16px;background:#2f73c9;display:grid;gap:12px;align-content:start}
.asc p{margin:0;color:var(--mute);line-height:1.35}
.stat{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:14px;background:#0004;border:2px solid var(--line)}
.stat b{color:var(--gold)}
.big{font-size:1.2rem;padding:12px;background:linear-gradient(#6ee89a,#1fae5b);color:#fff;box-shadow:0 4px 0 #0f6b35}
.link{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;padding:8px;margin-top:12px}
#wait{position:absolute;inset:0;z-index:8;background:#0a1d3df2;display:grid;place-items:center;font-weight:800;font-size:1.4rem;color:#fff;animation:fadeIn .25s}
#wait[hidden]{display:none}
#wait p{margin:0;text-align:center}
#wait small{display:block;margin-top:14px;font-size:.85rem;font-weight:600;color:var(--mute)}
#wait img{display:block;width:min(46vmin,260px);height:min(46vmin,260px);object-fit:contain;margin:0 auto 10px}
.ico{width:1.2em;height:1.2em;vertical-align:-.22em;object-fit:contain}
.tabs .ico{width:24px;height:24px;vertical-align:middle}
.tile .ico{width:100%;height:100%}
#wait i{font-style:normal;display:inline-block;overflow:hidden;vertical-align:bottom;width:0;animation:dots 1.2s steps(4,end) infinite}
@keyframes dots{to{width:1.2em}}
@keyframes fadeIn{from{opacity:0}}
/* ---------- đấu trường: màn riêng che cả khung (VS → thoại → đếm ngược → đấu → kết quả) ---------- */
#arena{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;overflow:hidden;cursor:pointer;background:var(--ab);background-size:cover;background-position:center;animation:fadeIn .25s}
#arena[hidden]{display:none}
#arena.a1{--ab:linear-gradient(#0009,#0002 45%,#000b),url(assets/bg/bg-arena1.webp) center/cover,linear-gradient(#3b4a6b,#18213a)}   /* phòng họp sau giờ làm */
#arena.a2{--ab:linear-gradient(#0009,#0002 45%,#000b),url(assets/bg/bg-arena2.webp) center/cover,linear-gradient(#3a1d5c,#140a24)}   /* sàn đấu thể hình */
#arena.a3{--ab:linear-gradient(#0009,#0002 45%,#000b),url(assets/bg/bg-arena3.webp) center/cover,linear-gradient(#2b0f3f,#08040f)}   /* bãi xe ngầm */
#arena.a4{--ab:linear-gradient(#0009,#0002 45%,#000b),url(assets/bg/bg-arena4.webp) center/cover,linear-gradient(#5a1408,#140402)}   /* hang dung nham */
.aStage{position:relative;flex:1;min-height:0}
.aPic{position:absolute;bottom:0;object-fit:contain;filter:drop-shadow(0 8px 0 #0007);transition:filter .25s,transform .25s;pointer-events:none}
.aPic[hidden]{display:none}
#aMe{left:3%;height:96%;max-width:46%}
#aFoe{right:3%;bottom:6%;height:64%;max-width:50%}
.aPic.dim{filter:brightness(.4) drop-shadow(0 8px 0 #0007)}
.aPic.on{transform:scale(1.05)}
#aTag{position:absolute;left:50%;top:10px;translate:-50% 0;text-align:center;padding:6px 18px;border-radius:14px;background:#000b;border:2px solid #ff4d5e;white-space:nowrap;max-width:94%}
#aTag small{display:block;color:var(--mute);font-size:.8rem}#aTag b{font-size:1.15rem}
.fight #aTag{display:none}
#aVs{position:absolute;left:50%;top:44%;translate:-50% -50%;font-size:clamp(3.2rem,11vw,6rem);font-weight:800;color:#fff;-webkit-text-stroke:10px #b3202e;paint-order:stroke fill;rotate:-8deg;opacity:0;pointer-events:none}
.vs #aVs{animation:vsIn 1.3s ease-out forwards}.vs #aMe{animation:slideL .5s ease-out}.vs #aFoe{animation:slideR .5s ease-out}.vs #aTag{animation:fadeIn .4s .3s both}
@keyframes vsIn{0%{opacity:0;transform:scale(3)}25%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
@keyframes slideL{from{translate:-130% 0}}@keyframes slideR{from{translate:130% 0}}
#aCount{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-size:clamp(4rem,16vw,8rem);font-weight:800;color:#fff;-webkit-text-stroke:12px var(--ink);paint-order:stroke fill}
#aBox{flex:none;position:relative;width:min(94%,640px);margin:18px auto 14px;min-height:92px;padding:22px 18px 18px;border-radius:18px;background:#fff;color:var(--ink);border:4px solid var(--ink);box-shadow:0 6px 0 #0008;font-weight:800;font-size:1.1rem;line-height:1.35}
#aBox[hidden],#aBtns[hidden]{display:none}
#aWho{position:absolute;top:-18px;left:14px;padding:2px 14px;border-radius:99px;background:#e5484d;color:#fff;font-size:.95rem;border:3px solid var(--ink)}
#aWho.me{background:#2f73c9}
#aTxt{margin:0}
#aNext{position:absolute;right:12px;bottom:2px;font-style:normal;font-size:.8rem;color:#5b6f96;animation:poke .8s ease-in-out infinite}
#aBtns{flex:none;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:0 12px 16px}
#aBtns .no{background:#3d5f8f;color:#fff;box-shadow:0 4px 0 #223c63}
@media(max-width:900px){#aBox{font-size:.98rem;min-height:80px}#aMe{height:auto;width:64%;max-width:none;max-height:96%}#aFoe{bottom:auto;top:12%;height:auto;width:58%;max-width:none}}   /* màn dọc: xếp so le, đối thủ trên phải, nhân vật dưới trái */
#pt{--c:var(--gold);position:absolute;z-index:4;display:grid;justify-items:center;gap:4px;border:0;background:none;padding:0;cursor:pointer;animation:ptLife 8s linear forwards}   /* khách ghé phòng tập: hiện 8 giây rồi đi mất */
#pt.cr{--c:#ff6fb0}#pt.ck{--c:#7dffb0}
#pt i{font-style:normal;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-size:2.6rem;line-height:1;background:radial-gradient(circle at 35% 30%,#fff,var(--c) 62%);border:4px solid #fff;box-shadow:0 4px 0 #0006;animation:ptPulse .8s ease-in-out infinite}
#pt i img{width:100%;height:100%;object-fit:contain;border-radius:50%}
#pt b{padding:2px 12px;border-radius:99px;background:var(--c);color:var(--ink);font-weight:800;font-size:.9rem;white-space:nowrap;box-shadow:0 3px 0 #0006}
@keyframes ptPulse{50%{transform:scale(1.12);box-shadow:0 4px 0 #0006,0 0 28px 10px var(--c)}}
@keyframes ptLife{from{opacity:0;transform:scale(.3)}5%{opacity:1;transform:scale(1)}85%{opacity:1;transform:none}to{opacity:0;transform:translateX(40px)}}
#pt.walk{animation:ptWalk 8s linear forwards}   /* crush đi ngang qua sân khấu */
@keyframes ptWalk{from{left:-120px}to{left:100%}}
@media(min-width:901px){#pt i{width:110px;height:110px;font-size:3.8rem;border-width:5px}#pt b{font-size:1.1rem;padding:3px 14px}}
.pop.crit{color:var(--gold);font-size:2.8rem}   /* cú bấm chí mạng (kỹ năng Sao) */
.pop.dmg{color:#ff5a6a;font-size:2.2rem;z-index:4}.pop.dmg.crit{color:var(--gold);font-size:2.8rem}.pop.tap{font-size:1.6rem}
.pop.perfect{color:var(--gold);font-size:2.4rem;z-index:4}.pop.miss{color:var(--mute);font-size:1.3rem}
/* Rep hoàn hảo: viền mờ là đích, vòng trắng co dần, chuyển vàng trong khoảng bấm đúng (chạy bằng JS theo hằng REP) */
#rep{position:relative;z-index:2;height:min(78%,400px);aspect-ratio:1;min-width:0;border-radius:50%;border:5px dashed #ffffff80;pointer-events:none;display:grid;place-items:center}
#rep i{grid-area:1/1;width:100%;height:100%;border-radius:50%;border:6px solid #fff;box-sizing:border-box;box-shadow:0 0 12px #0008}
#rep.warn{animation:repWarn .45s ease-in-out infinite alternate}@keyframes repWarn{to{transform:scale(1.06);border-color:var(--gold);box-shadow:0 0 24px var(--gold)}}
#rep b{position:absolute;top:0;left:50%;translate:-50% -130%;padding:3px 12px;border-radius:99px;background:#000b;color:var(--gold);font-size:.95rem;white-space:nowrap}
#evBox{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 0 8px}
#evBox[hidden]{display:none}
#evBox .big{min-width:0;padding:8px 6px;font-size:.95rem}
#evBox small{display:block;font-size:.75rem;font-weight:700;opacity:.8;margin-top:2px}
#say.ev{border:3px solid var(--gold);box-shadow:0 4px 0 #b85c00}
.asc .league{padding:6px 0 0}
#chs .card em{white-space:normal}
.card .need{display:block;font-style:normal;font-size:.75rem;color:var(--mute)}
#chPill{border-color:#ff6fb0;color:#ffd1e6}
.frenzy .aura{opacity:1;background:radial-gradient(circle,var(--gold2) 0,transparent 66%)}.frenzy .pop{color:var(--gold)}
#testTag{position:absolute;left:6px;bottom:6px;z-index:7;padding:2px 8px;border-radius:8px;background:#e5484d;color:#fff;font-weight:800;font-size:.75rem;pointer-events:none}
#modal{position:absolute;inset:0;z-index:9;background:#000a;display:grid;place-items:center;padding:16px}
#modal[hidden]{display:none}
#modal div{background:var(--panel);border:3px solid var(--line);border-radius:18px;padding:18px;max-width:360px;text-align:center}
#modal p{margin:0 0 14px;line-height:1.35}
#modal button{margin:0 4px}
#modal .no{background:#3d5f8f;color:#fff;box-shadow:0 4px 0 #223c63}
#guide,#setBox{position:absolute;inset:0;z-index:9;background:#000a;display:grid;place-items:center;padding:16px}
#guide[hidden],#setBox[hidden]{display:none}
#setBox>div{position:relative;background:var(--panel);border:3px solid var(--gold);border-radius:18px;padding:16px 18px 18px;width:min(100%,440px);display:grid;gap:14px}
#setBox h2{margin:0;text-align:center}
#sX{position:absolute;top:8px;right:8px;min-width:40px;height:40px}
.srow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-weight:800}
.srow>span{flex:1 0 100%}
.srow .round{min-width:40px;height:40px;font-size:1.3rem}
.srow .chip{flex:1;height:42px}
.seg{flex:1;display:flex;gap:3px;height:28px;cursor:pointer}
.seg i{flex:1;border-radius:5px;background:#0006;border:2px solid var(--line)}
.seg i.on{background:linear-gradient(var(--gold),var(--gold2));border-color:var(--gold)}
.srow b{width:1.6em;text-align:right;color:var(--gold)}
#guide>div{position:relative;display:flex;flex-direction:column;background:var(--panel);border:3px solid var(--gold);border-radius:18px;padding:16px 18px;width:min(100%,860px);max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px)}   /* theo màn hình: % ở đây bị tính theo nội dung nên không chặn được chiều cao */
#guide h2{margin:0 0 6px;text-align:center}
#gX{position:absolute;top:8px;right:8px;min-width:40px;height:40px}
#gBody{overflow:auto;min-height:0;margin-bottom:12px;line-height:1.35;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:2px 24px;align-content:start}   /* desktop 2 cột, điện thoại 1 cột */
#gBody h3{margin:10px 0 4px;color:var(--gold);font-size:1.05rem}
#gBody ul{margin:0;padding-left:20px}
#gBody li{margin:3px 0}
#gBody p{margin:0;color:var(--mute)}
@media(max-width:900px){.panel{margin:0 8px 8px}#bg{bottom:46%}
  /* điện thoại: thẻ trong bảng gọn hơn để thấy nhiều dòng */
  .tabs{padding:6px 6px 0}.tabs button{padding:3px 0 2px;font-size:.56rem}.tabs .ico{width:20px;height:20px}.tabs button::first-line{font-size:1.05rem}
  .tools{padding:6px 10px;font-size:.85rem}
  .list{padding:6px;gap:5px}
  .card,#pets .card,#achs .card{grid-template-columns:44px 1fr auto;gap:7px;padding:5px 6px;border-radius:12px}
  .tile{width:44px;height:44px;border-radius:10px;font-size:1.3rem}
  .card b{font-size:.88rem}.card small,.card em{font-size:.72rem}.ms,.goal,.card .need,.lv,.rar{font-size:.66rem}.card small{line-height:1.15}.goal{display:inline-block}   /* mục tiêu chung dòng với chỉ số: bớt một dòng mỗi thẻ */
  .buy{min-width:68px;min-height:38px;padding:3px 7px;font-size:.82rem;border-radius:10px}.buy small{font-size:.68rem}
  .league{font-size:.85rem;padding:4px 4px 0}
  .asc{padding:10px;gap:8px}.stat{padding:6px 10px;font-size:.82rem}
  #summon{min-width:120px}
}
#duel{position:relative;z-index:2;flex:none;width:min(94%,560px);margin:12px auto 0;padding:8px 12px;border-radius:16px;background:#000c;border:2px solid #ff4d5e}
#duel[hidden]{display:none}
#dAva img{width:44px;height:44px;object-fit:contain;display:block}
.dhead{display:flex;gap:8px;align-items:center;font-size:1.05rem}
.dhead b{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dTime{font-weight:800;color:var(--gold);font-size:1.3rem}
.dbar{position:relative;height:24px;border-radius:99px;background:#fff2;overflow:hidden;margin-top:6px}
.dbar i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:linear-gradient(90deg,#3ddc84,#b6ff8a)}
.dbar.foe{height:12px}
.dbar.foe i{inset:0 0 0 auto;background:#ff4d5e}
#dName{text-align:right}
.dbar span{position:absolute;inset:0;display:grid;place-items:center;font-size:.85rem;font-weight:800;text-shadow:0 1px 2px #000}
.card>div:nth-child(2){min-width:0}
#rivals em{white-space:normal}
.league{font-weight:800;color:var(--gold);padding:6px 4px 0}
.league.lock{color:var(--mute)}
.card.done{opacity:.6}
.fight{background:linear-gradient(#ff7b88,#e5484d);color:#fff;box-shadow:0 4px 0 #8f1d2c}
.fight:active:not(:disabled){box-shadow:0 1px 0 #8f1d2c}
#pets .card{grid-template-columns:60px 1fr auto}
#pets .card.hid .tile{filter:brightness(0) opacity(.5)}
#pets .tile img,#rivals .tile img{padding:0}
.rar{font-size:.75rem;font-weight:800;text-align:center;line-height:1.2;padding:4px 10px;border-radius:10px;background:#0005;color:var(--c)}
.rar small{color:var(--mute);font-weight:600}
#summon{min-width:150px}
.card .bar{margin-top:4px}
#achs,#stats{display:grid;gap:8px}
#achs .card{grid-template-columns:60px 1fr auto}
#achs .card.hid .tile{filter:grayscale(1) opacity(.5)}

@keyframes pulseG{50%{transform:none;box-shadow:0 3px 0 #0f6b35,0 0 10px #6ee89a66}}

.panel{background:var(--panel);border:1px solid #ffffff38;box-shadow:0 12px 32px #0006}
.tabs button{border:0;border-bottom:2px solid transparent;background:#0d1e30a8;font-weight:650;text-shadow:none;transition:background .12s,color .12s}

.tools{background:#1b3045;border-bottom:1px solid #ffffff1a;text-shadow:none}
.chip{box-shadow:none}
.chip.on{background:var(--gold);box-shadow:none}
.list{background:#182d42}
.card{background:#20384e;border:1px solid #41566b;box-shadow:none;transition:border-color .12s,background .12s}
.card:hover{background:#263f55;border-color:#63778a}
.card.next{border:2px solid var(--gold);box-shadow:0 0 0 1px #f2bd5433}
.tile{border:1px solid #ffffff44;box-shadow:inset 0 -2px 0 #0003}
.card b{font-weight:700;text-shadow:none}
.card small{font-weight:500}
.lv{background:#f2bd54;border:0;box-shadow:none;font-weight:750}
.buy,.big{border:0;font-weight:700;text-shadow:none;box-shadow:0 2px 0 #a86e24;transition:transform .12s,filter .12s,box-shadow .12s}
.buy:hover:not(:disabled),.big:hover:not(:disabled){filter:brightness(1.06)}
.buy:active:not(:disabled),.big:active:not(:disabled){transform:translateY(1px);filter:brightness(.96);box-shadow:0 1px 0 #a86e24}
.big{background:#3aab78;box-shadow:0 2px 0 #24744f}
.buy:disabled,.big:disabled{border-color:transparent;box-shadow:0 1px 0 #1b2f48}
.fight{background:#d85b63;box-shadow:0 2px 0 #8f3941}

.stat{background:#1b3045;border:1px solid #40566c;box-shadow:none}
.stat b{font-weight:700;text-shadow:none;font-variant-numeric:tabular-nums}

#ostats .stat span{color:var(--mute);font-weight:600}

.league{text-shadow:none;letter-spacing:.01em}
.goal{font-weight:750;text-shadow:none}
.ms{font-weight:650;text-shadow:none}
.rar{border:1px solid var(--c);box-shadow:none;font-weight:700}
.meal{background:#1b3045;border:1px solid #40566c;box-shadow:none;font-weight:650}

#toast{background:#14283df5;border-color:var(--gold);box-shadow:0 8px 24px #0008}

        [["Còn nhớ mấy sáng mùa đông, cái chăn ấm cứ níu ngươi lại không?", "Phép của ta đấy.", "Ta sẽ giữ ngươi trên giường, như đã giữ cả triệu người khác."], "Tôi dậy từ năm giờ rồi.", "Chăn vẫn đang đợi ngươi đấy. Ấm lắm.", "Trong người ngươi… nóng quá.", "Ngủ ngon. Ngủ luôn đi."],
        [["TA LÀ CƠN GIẬN CỦA TRÁI ĐẤT.", "CỨ MỖI LẦN CÓ ĐỨA BỎ TẬP VÌ 'NÓNG QUÁ', TA LẠI TO THÊM.", "NGƯƠI CŨNG SẼ CHẢY RA NHƯ BỌN CHÚNG."], "Tôi chỉ nóng lúc khởi động thôi.", "NÓNG NỮA! NÓNG NỮA!", "LỬA… TẮT DẦN…", "CHẢY RA ĐI!"],
        [["Đã phân tích. Ngươi thắng 28 trận, ngày nào cũng mạnh lên.", "Ta là thứ đứng sau mọi màn hình bắt người ta lướt thêm 'năm phút nữa'.", "Dự đoán: ngươi thua. Xác suất 99,97%."], "Ông kế toán ở công ty cũng nói y chang vậy. Tôi tắt thông báo rồi.", "Đã cập nhật mô hình từ trận trước.", "Lỗi… không tính được… ý chí.", "Đúng như dự đoán."],
        [["Thì ra ngươi là đứa đánh thức ta.", "Mấy nghìn năm nay ta lớn lên nhờ mỗi giờ con người ngồi im, mỗi lần họ bảo 'mai tập'.", "Còn ngươi thì không bảo 'mai'. Ngươi tới tận đây."], "Tôi tới để nói: hôm nay.", "Ngươi lại đứng dậy. Ta ghét nhất cái đó.", "Ngươi thắng… Nhưng ngoài kia, giữa các vì sao, còn có kẻ lười hơn ta nhiều…", "Ngồi xuống. Ngồi luôn đi."]],

         day:['📅 Một ngày của bạn', ['Văn phòng → 🏋️ phòng tập → 🏠 nhà → 😴 ngủ là hết một ngày.', 'Ở phòng tập: bấm vào nhân vật để kiếm 🔥 calo, dùng calo mua bài tập.', 'Tập đủ mục tiêu 🎯 của mọi nhóm cơ để lên hạng. Lên hạng mở thêm tính năng.', 'Bấm ❓ bất cứ lúc nào để xem lại hướng dẫn.']],
         gym:['💪 Bấm hay để calo tự chạy?', ['Mỗi cú bấm tốn 1 ⚡ thể lực. Thể lực đầy lại mỗi sáng.', 'Bài Tay và Mắt tăng calo mỗi lần bấm. Các bài khác tăng calo mỗi giây.', 'Calo mỗi giây vẫn chạy khi bạn không bấm, cả khi tắt game (tối đa 8 giờ).', 'Mỗi bài tập nhân đôi hiệu quả ở cấp 25, 50 và 100.']],
         sta:['⚡ Hết thể lực', ['Hết thể lực thì không bấm được nữa, nhưng calo mỗi giây vẫn chạy.', 'Về nhà rồi đi ngủ: sáng mai thể lực đầy lại.', 'Dùng càng nhiều thể lực trong ngày, càng giảm cân nhiều.']],
         home:['🏠 Buổi tối ở nhà', ['Gọi 🐶 bạn tập: ra ngẫu nhiên, trùng con cũ thì con đó lên cấp. Mỗi lần gọi, giá tăng gấp 2,5.', 'Calo gọi bạn tập là calo không dùng mua bài tập: gọi khi bài tập đã đắt.', 'Đi ngủ để sang ngày mới.']],
         meal:['🍱 Chọn bữa tối', ['Miễn phí, mỗi tối chọn một món hoặc bỏ bữa. Cân nặng và mệt mỏi đổi ngay, các chỉ số khác có tác dụng vào ngày mai.', '🥗 Healthy: giảm cân, thêm chút thể lực hoặc bớt mệt.', '🍳 Protein: thêm 10–35% calo ngày mai, cân gần như không đổi.', '🧋 Ăn vặt: nhiều thể lực và sức bấm nhất, nhưng tăng cân.', 'Mẹo: tới hạng 3 cân nặng chưa chặn gì, cứ ăn vặt để tập được nhiều. Muốn lên hạng 4 thì phải giảm cân.']],
         fat:['😮‍💨 Mệt mỏi và ngày nghỉ', ['Tập càng nhiều càng mệt. Mỏi (40): thể lực −25%. Kiệt sức (70): −50%. Quá tải (100): bắt buộc nghỉ.', 'Ngày nghỉ (không tập, hoặc dùng dưới {r}% thể lực) giảm 60 mệt mỏi.', 'Nghỉ lúc đang mỏi: mai bấm +25%. Nghỉ lúc còn sung sức là lười: +0,3 kg.', 'Mục tiêu tuần: đủ số buổi tập (mỗi buổi dùng ít nhất nửa thể lực) thì tuần sau +10% calo.', 'Chủ nhật: thách đấu miễn phí, thưởng x2.']],
         kg:['⚖️ Cân nặng', ['Hạng 4 cần ≤ {k4} kg, hạng 5 ≤ {k5} kg, hạng 6 ≤ {k6} kg, hạng 7–9 ≤ {k7} / {k8} / {k9} kg.', 'Một ngày tập hết thể lực: −0,3 kg (tập một phần thì giảm theo tỉ lệ). Ngày nghỉ: +0,1 kg (lười thì +0,3 kg). Bữa tối và sự kiện cộng/trừ ngay lúc chọn.', 'Trong khoảng 68–72 kg: +20% calo. Trên 90 kg: thể lực −20%.', 'Cứ 30 ngày có một lần cân kiểm tra: mỗi 2 kg giảm được = 1 ⭐.']],

         asc:['⭐ Lên đời', ['Mất: calo, cấp bài tập, hạng hiện tại.', 'Giữ: Sao, bạn tập, trận thắng, thành tựu, cân nặng và tính năng đã mở.', 'Mỗi ⭐ +10% calo vĩnh viễn. Đời này kiếm càng nhiều calo, càng nhận nhiều Sao.', 'Mẹo: lên đời khi Sao nhận được ít nhất bằng số Sao đang có, hoặc khi tiến độ đã chậm hẳn.', 'Dùng Sao học ⭐ kỹ năng ở cuối tab Lên đời. Học không làm mất +10% của Sao, nên cứ học.']],
         rep:['🎯 Rep hoàn hảo', ['Khoảng 30 cú bấm một lần, viền quanh nhân vật nhấp nháy báo trước 2 giây, rồi một vòng trắng co dần. Dừng tay, đợi vòng chuyển vàng rồi mới bấm.', 'Đúng lúc: PERFECT, cú đó x5. PERFECT liên tiếp thì x6, x7… tới x10.', 'Bấm sớm hay trễ: hụt, mất chuỗi PERFECT. Mỗi cú vẫn chỉ tốn 1 ⚡.', 'Đánh đổi: dừng tay chờ vòng thì chậm hơn một chút, nhưng cùng một thanh thể lực ra nhiều calo hơn.']],
         ev:['📌 Sự kiện văn phòng', ['Từ ngày 2, mỗi ngày ở văn phòng có một tình huống với hai lựa chọn.', 'Mỗi lựa chọn ghi rõ được gì, mất gì. Lựa chọn may rủi có ghi tỉ lệ %.', 'Tác dụng "hôm nay" hết khi đi ngủ. Không chọn mà đi tập thì bỏ qua sự kiện hôm đó.']],

let toastEnd = 0;

}

  $('toast').animate([{opacity:0, transform:'translate(-50%,-50%) scale(.6)'}, {opacity:1, transform:'translate(-50%,-50%) scale(1)', offset:.12}, {opacity:1, offset:.8}, {opacity:0}], ms);

function syncRank(quiet) {

  const c = CH.find(x => x.k === s.ch);
  if (c && s.rk >= c.goal) {   // xong thử thách: luật hết tác dụng, thưởng vĩnh viễn

// ============ Âm thanh (tổng hợp bằng WebAudio, không cần file) ============
// Đường tiếng: hiệu ứng → ac.sfx (âm lượng) → bộ nén → loa; nhạc → mBus (hạ nhỏ lúc lên hạng/thắng) → mVol (âm lượng) → mLp (lọc trầm khi mở bảng) → bộ nén → loa.

}
function voice(make, d, v, when) {   // một tiếng ngắn; make(t) trả [nguồn, đầu ra]. Tối đa 16 tiếng cùng lúc, quá thì bỏ
  if (!s.vs || adOn || CG?.game.settings.muteAudio || voices >= 16) return;   // cài đặt tắt tiếng của CrazyGames luôn được ưu tiên

function setVol() {   // nấc 0–10 → độ lợi (v/5)²: nấc 5 = mức gốc, nấc 3 ≈ −9 dB, nấc 10 = +12 dB (bộ nén chặn rè)

const rnd = (a, b) => a + Math.random() * (b - a);
// Ba tầng thưởng: tiếng nhỏ (buy, eat, pick) < ding, coin (nhiệm vụ, thành tựu, khách) < up (lên hạng, thắng trận, lên đời). Giữ up cho việc lớn.

  crit:  () => { noise(3000, .1, .08, 0, 800); beep(1200, .08, 'triangle', .05); },
  perfect: n => { const f = 660 * 2 ** (Math.min(n - 1, 12) / 12); beep(f, .08, 'square', .045); beep(f * 1.5, .14, 'square', .04, .06); buzz(15); },   // combo: mỗi lần trúng cao thêm nửa cung, tối đa một quãng tám
  buy:   () => { beep(660, .07); beep(880, .1, 'square', .04, .07); },

  pick:  () => { beep(540, .05, 'triangle', .05); beep(720, .06, 'triangle', .05, .05); },

// ============ Nhạc nền (assets/music/<màn>.mp3, tải khi cần) ============
const LOUD = .05, STING = .08, VOXL = .06;   // độ to (RMS) mong muốn sau khi cân: nhạc nền khoảng -26 dB, nghe rõ nhưng không át tiếng bấm; đoạn nhạc thưởng to hơn để nổi lên; giọng và tiếng khách ở giữa
const VOX = {pt: 3, crush: 3, 'crush-yes': 2, 'crush-no': 2, cake: 2, 'hero-m': 3, 'hero-f': 3};   // assets/sfx/<loại>-<n>.mp3: số biến thể, phát ngẫu nhiên
const mBuf = {}, sBuf = {};
function loadBuf(path, loud) {   // tải và giải mã assets/<path>.mp3, cân âm lượng theo độ to thật của file
  return fetch(`assets/${path}.mp3`).then(r => r.ok ? r.arrayBuffer() : Promise.reject()).then(b => ac.decodeAudioData(b)).then(buf => {
    const d = buf.getChannelData(0); let sum = 0, n = 0;
    for (let i = 0; i < d.length; i += 16) { sum += d[i] * d[i]; n++; }
    buf.vol = Math.min(2.5, loud / Math.max(.001, Math.sqrt(sum / n)));
    return buf;
  });
}
function sting(name, fb = () => {}, big = true) {   // phát file đã tải sẵn theo nấc Âm thanh; chưa tải xong hoặc thiếu file thì phát tiếng bíp fb. big: đoạn nhạc thưởng (nhạc nền nhỏ lại, rung)
  const buf = sBuf[name];
  if (!buf) return fb();
  if (!s.vs || adOn || CG?.game.settings.muteAudio) return;
  try { const src = ac.createBufferSource(), g = ac.createGain(); src.buffer = buf; g.gain.value = buf.vol; src.connect(g).connect(ac.sfx); src.start(); if (big) duck(buf.duration); } catch {}
  if (big && name !== 'lose') buzz(40);
}
const vox = (k, fb) => sting(`${k}-${1 + Math.floor(Math.random() * VOX[k])}`, fb, false);   // một biến thể ngẫu nhiên của giọng/tiếng khách
let mNode = null, mName = '', mWant = '', heard = false;   // heard: người chơi đã chạm màn hình lần nào chưa
const musicOn = () => s.vm > 0 && !adOn && !CG?.game.settings.muteAudio && !document.hidden;
function music(name) {
  mWant = name;
  if (!heard) return;
  const play = musicOn() ? name : '';
  if (play === mName) return;
  mName = play;
  try {
    audio();
    if (mNode) { mNode.g.gain.setTargetAtTime(0, ac.currentTime, .15); mNode.src.stop(ac.currentTime + .8); mNode = null; }   // làm mờ bài cũ
    if (!play) return;
    mBuf[play] ??= loadBuf('music/' + play, LOUD);
    mBuf[play].then(buf => {
      if (mName !== play || mNode) return;   // đã đổi bài trong lúc tải
      const src = ac.createBufferSource(), g = ac.createGain(), t = ac.currentTime;
      src.buffer = buf; src.loop = play !== 'sleep';
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(buf.vol, t + .6);
      src.connect(g).connect(mBus); src.start(); mNode = {src, g};
    }).catch(() => { delete mBuf[play]; if (mName === play) mName = ''; });   // thiếu file: im lặng, lần sau thử lại
  } catch {}
}
const tune = () => music(mWant === 'sleep' && !$('wait').hidden ? 'sleep' : arena ? 'duel' : s.scene === 'gym' ? ['gym', 'gym2', 'gym3'][Math.min(2, Math.floor(shown / 3))] : s.scene);   // mỗi màn một bài, phòng tập đổi bài theo hạng (1–3, 4–6, 7–9); thi đấu và chuỗi đi ngủ có bài riêng
// Trình duyệt chỉ cho phát tiếng sau cú chạm đầu tiên của người chơi.
addEventListener('pointerdown', () => {

  s.cal -= c; s.lv[e.k] += n;

  if (boost(s.lv[e.k]) > b0) toast(e[s.lang][0] + ' x' + boost(s.lv[e.k]) / b0 + '!');
  if (g && was < g && s.lv[e.k] >= g) toast('🎯 ' + e[s.lang][0], kg(e, g) + ' ✓');

}

  ask(tr('qCh').replace('{x}', tr('ch')[c.k][0]).replace('{n}', starGain()), () => ascend(c.k));
};
$('boost').onclick = () => showAd('rewarded', ok => { if (ok) { s.sta += Math.floor(staMax() * .5); s.drink = true; sfx.eat(); ui(); save(); } });
// ============ Một ngày: văn phòng → phòng tập → nhà → ngủ → ngày mới ============
function drawMeals() {
  $('meals').innerHTML = menu().map(j => MEALS[j]).map((m, n, _, j = MEALS.indexOf(m)) => `<button class="meal" data-m="${j}"><img src="assets/food/food-${m.k}.webp" alt="" draggable="false" onerror="this.outerHTML='<span>${m.i}</span>'"><b>${m[s.lang]}</b><em>${mealDesc(m)}</em><i style="font-style:normal">${m.kg ? (m.kg > 0 ? '+' : '') + m.kg + ' kg' : '±0 kg'}</i></button>`).join('');
}
function go(scene) {
  s.scene = scene; stopDuel(); ptHide(); repHide(); combo = 0; drawMeals(); drawArt(); drawDay(); tab(scene === 'home' ? 'Pet' : 'Ex');
  $('flash').animate([{opacity:.9}, {opacity:0}], 500); ui(); save(); tune();
  coach(...{gym: ['gym'], home: ['home', 'meal', 'fat', 'kg'], office: s.ev ? ['ev'] : []}[scene] || []);
}
function evPick(o) {
  const e = evOf(); if (!e) return;
  let f = e[o], luck = '';
  if (f.p) { const ok = Math.random() < f.p; luck = tr(ok ? 'evOk' : 'evNo') + ': '; f = ok ? f.ok : f.no; }
  const d = evDesc(f);   // ghi trước khi cộng, để số calo trong thông báo khớp với số trên nút
  if (f.kg) setKg(s.kg + f.kg);
  if (f.fat) s.fat = Math.min(100, Math.max(0, s.fat + f.fat));
  if (f.sta) s.sta = Math.max(0, s.sta + Math.floor(staMax() * f.sta));
  if (f.cal) earn(evCal(f.cal));
  if (f.buf) s.buff.cal = f.buf;
  if (f.tap) s.buff.tap = f.tap;
  if (f.star) s.stars += f.star;
  s.ev = null; sfx.pick(); toast(tr('ev')[e.k][o === 'a' ? 1 : 2], luck + (d || tr('evNone')), 3000); drawDay(); ui(); save();
}
$('evA').onclick = () => evPick('a'); $('evB').onclick = () => evPick('b');
function endDay() {
  const frac = Math.min(1, s.used / Math.max(1, s.cap)), r = rankOf(), note = [], kg0 = s.kg, trained = frac >= REST, few = !trained && s.used > 0;
  if (!trained) {   // ngày nghỉ (kể cả tập quá ít): nghỉ khi đang mỏi thì được "Hồi phục", nghỉ khi còn sung sức là lười
    const lazy = s.fat < 40; s.rec = !lazy; setKg(s.kg + (lazy ? .3 : .1)); s.fat = Math.max(0, s.fat - 60);
  } else {         // ngày tập: mệt mỏi và cân nặng theo tỉ lệ thể lực đã dùng; trước hạng 3 chưa tính mệt mỏi
    s.rec = false; setKg(s.kg - (.3 + .1 * chd('party')) * frac); s.fat = Math.min(100, Math.max(0, s.fat + (unl() >= 2 ? FAT[r] * frac * (1 - .15 * sk('calm')) : 0) - 5));
  }
  s.week.push(frac >= .5 ? 1 : 0);
  if (s.week.length >= 7) { s.wkBonus = unl() >= 2 && s.week.reduce((a, b) => a + b) >= WK[r]; if (unl() >= 2) note.push(tr(s.wkBonus ? 'wkOk' : 'wkNo')); s.week = []; }
  s.day++; s.meal = s.next; s.next = null; s.drink = false; s.vis = 0; s.buff = {};
  if ((s.day - 1) % 30 === 0) {   // cân kiểm tra mỗi 30 ngày: 1 Sao cho mỗi 2 kg giảm được
    const st = Math.max(0, Math.floor((s.kg30 - s.kg) / 2)); s.stars += st; s.kg30 = s.kg; note.push(`${tr('weigh')}: +${st} ⭐`);
  }
  s.cap = s.sta = staMax(); s.used = 0; s.q = {day: s.day, p: {}, got: {}};
  sayIdx = Math.floor(Math.random() * 8);
  const evs = EV.filter(e => (e.need || 0) <= unl() && e.k !== s.ev); s.ev = evs[Math.floor(Math.random() * evs.length)].k;   // mỗi ngày một sự kiện, không lặp lại hôm qua
  if (chOn('party')) setKg(s.kg + CHX.night);   // thử thách Mùa tiệc cưới: tối nào cũng đi tiệc
  const sg = x => (x > 0 ? '+' : '−') + Math.abs(x).toFixed(1), dk = s.kg - kg0, other = kg0 - s.kg1;   // other: bữa tối, sự kiện, bánh… trong ngày (đã cộng ngay lúc xảy ra)
  note.unshift(`${tr(trained ? 'kgTrain' : few ? 'kgFew' : 'kgRest')}: ${sg(dk)} kg` + (Math.abs(other) >= .05 ? ` · ${tr('kgOther')}: ${sg(other)} kg` : '')
    + ` → ⚖️ ${s.kg.toFixed(1)} kg (${sg(s.kg - s.kg1)})` + (unl() >= 2 ? ' · ' + tr('fat' + fatLv()) : ''));
  s.kg1 = s.kg;
  save(); backup(); go('office'); sfx.day(); syncRank(); toastLater(`${tr('day')} ${s.day}`, note.join(' · '), 4500); ui(); save();   // lên hạng qua đêm: chúc mừng trước, báo cân ngay sau
  if (s.day % 3 === 0) showAd('midgame', () => {});
}
let waitT, waitDone, waitAt = 0;
function travel(steps, done) {   // màn chờ khi chuyển cảnh: lần lượt từng [chữ, ms]; che cả khung. Ba ngày đầu chạy đủ để kể chuyện, sau đó còn 40%; chạm để bỏ qua.
  const [[key, ms], ...rest] = steps;
  if (!waitDone) waitAt = Date.now();
  waitDone = done;
  $('waitPic').hidden = false; $('waitPic').src = `assets/scene/scene-${key.slice(1).toLowerCase()}.webp`;
  $('wait').querySelector('span').textContent = tr(key); $('wait').hidden = false;
  waitT = setTimeout(() => rest.length ? travel(rest, done) : endWait(), ms * (s.day > 3 ? .4 : 1));
}
function endWait() { clearTimeout(waitT); const d = waitDone; waitDone = null; $('wait').hidden = true; d?.(); }
$('wait').onclick = () => { if (Date.now() - waitAt > 400) endWait(); };   // chờ 0,4 giây để cú bấm vừa rồi không vô tình bỏ qua luôn
$('go').onclick = () => travel([['tGym', 2000]], () => { go('gym'); sfx.go(); if (CG && !playing) { playing = true; CG.game.gameplayStart(); } });
$('rest').onclick = () => ask(tr('qRest'), () => travel([['tHome', 2000]], () => { const lazy = s.fat < 40; go('home'); toast('🛋️', tr(lazy ? 'skipDay' : 'restDay')); }));   // nghỉ khi còn sung sức = bỏ tập
const goHome = () => travel([['tHome', 2000]], () => go('home'));
$('goHome').onclick = () => s.sta < 1 ? goHome() : ask(tr('qHome'), goHome);   // hết thể lực thì về luôn: không thể là bấm nhầm
$('sleep').onclick = () => { music('sleep'); travel([['tSleep', 2000], ['tMorning', 1500], ['tCommute', 2000], ['tWork', 3000]], endDay); };
for (const k of ['gym', 'home', 'sleep', 'morning', 'commute', 'work']) new Image().src = `assets/scene/scene-${k}.webp`;   // tải trước để màn chờ không bị trễ ảnh
if (TEST > 1) $('frame').insertAdjacentHTML('beforeend', '<div id="testTag">TEST x100</div>');
$('meals').onclick = ev => {
  const b = ev.target.closest('.meal'); if (!b || b.disabled) return;
  const m = MEALS[b.dataset.m];
  setKg(s.kg + m.kg); s.fat = Math.max(0, s.fat + (m.fat || 0)); s.next = m.k; sfx.eat(); toast(m.i + ' ' + m[s.lang], mealDesc(m)); ui(); save();
};
$('who').onclick = () => { s.char = (s.char + 1) % CHARS.length; drawArt(); sfx.pick(); save(); };
$('reset').onclick = () => ask(tr('qReset'), () => { stopDuel(); write(OLD); s = Object.assign(fresh(), {lang: s.lang, vm: s.vm, vs: s.vs, char: s.char}); syncRank(true); ui(); save(); tab('Ex'); });

// ============ Khởi động + vòng lặp ============
(async () => {
try {
  const k = window.CrazyGames.SDK;
  await Promise.race([k.init(), new Promise((_, no) => setTimeout(no, 15000))]);   // chờ lâu: nếu bỏ cuộc sớm, game dùng bộ nhớ máy thay vì tài khoản CrazyGames và người chơi tưởng mất tiến trình
  if (k.environment !== 'disabled') {
    CG = k; CG.game.loadingStart();
    const old = localStorage.getItem(KEY);   // bản lưu có từ trước khi gắn SDK
    if (old && !CG.data.getItem(KEY)) CG.data.setItem(KEY, old);
  }
} catch {}
load(); ready = true; tune();   // người chơi có thể đã chạm lúc bản lưu còn đang tải (s là fresh(), màn gym): chọn lại bài theo màn thật
shown = rankOf(); drawArt(); buildTexts(); tab(s.scene === 'home' ? 'Pet' : 'Ex');
if (CG) {
  CG.game.loadingStop(); try { CG.game.addSettingsChangeListener(tune); } catch {}
  try { CG.user.addAuthListener(() => { ready = false; }); } catch {}   // đăng nhập giữa chừng: CrazyGames tự tải lại trang với dữ liệu tài khoản; ngừng lưu để bản khách không ghi đè lên tài khoản
}
if (Date.now() - s.t > 864e5) { s.used = 0; s.scene = 'home'; endDay(); }   // vắng hơn 24 giờ thật: tính là 1 ngày nghỉ
{ // calo kiếm được lúc tắt game, tối đa 8 giờ
  const away = Math.min((Date.now() - s.t) / 1000, offH() * 3600), gain = pps() * away;
  if (away > 60 && gain >= 1) { earn(gain); toast(tr('away'), '+' + fmt(gain) + ' 🔥'); }
  s.t = Date.now();
}
if (s.scene === 'office') coach('day', ...(s.ev ? ['ev'] : []));
setInterval(() => {   // tính theo thời gian thực nên tab bị ẩn vẫn cộng đúng
  const now = Date.now();
  const dt = Math.min((now - s.t) / 1000, offH() * 3600);
  earn(pps() * dt); duelTick(dt, now);
  if (duel) { const left = Math.ceil((duel.end - now) / 1000); if (left <= 3 && left > 0 && left !== duel.tk) { duel.tk = left; beep(1000, .05, 'square', .04); } }   // 3 giây cuối: tiếng tích tắc
  if (mNode) mNode.src.playbackRate.value = duel && duel.end - now < 5000 ? 1.08 : 1;   // 5 giây cuối trận: nhạc nhanh lên
  muffle(!$('modal').hidden || !$('guide').hidden);
  const live = Math.min(dt, 5); s.play += live; bump('play', live);   // không tính thời gian tab bị ẩn lâu
  if (s.scene === 'gym' && s.vis < PT.day + sk('fan') && !arena && !$('pt') && !document.hidden && $('wait').hidden && $('modal').hidden && $('guide').hidden && $('setBox').hidden && (ptIn -= live) <= 0) ptShow();
  $('frame').classList.toggle('frenzy', now < frenzy);
  s.t = now; ui();
}, 100);
setInterval(save, 5000);
addEventListener('visibilitychange', save);
addEventListener('pagehide', save);
})();
</script>
